# DESCRIPTIVE ONLY — the shape of the win-validator VM worker in blastbox vm_compose terms. NOTHING in
# this repo parses this file: the pool is configured in code by winval_blastbox/vm_pool.py from the
# AUTHENTICODE_* variables in /etc/winval/winval.env (POOL_SIZE, GOLDEN_BASE, AGENT_PORT, IP_POOL,
# SMOKE_SAMPLE, WARM_DIR, and for egress: AUTHENTICODE_EXIT, AUTHENTICODE_EGRESS_PORTS,
# AUTHENTICODE_BLOCK_INTERNAL, AUTHENTICODE_VPN_TABLE/VPN_TUN, AUTHENTICODE_FAKENET_ADDR,
# AUTHENTICODE_GATEWAY, AUTHENTICODE_LEG). Editing this file changes nothing; set those instead.
# The OS-install base (autounattend WS2025) is produced once and lives at image.base_qcow2;
# golden_build.py layers the worker value-add on top, gated + promoted.
workers:
  authenticode:
    image:
      golden: /dev/shm/golden-base.qcow2                                # what workers boot (overlay COW)
      base_qcow2: /var/lib/libvirt/images/winserver2025-core.qcow2      # the packer's output, installed as GOLDEN_MASTER
      builder: qemu
      provisioners:
        # one reproducible, ordered, idempotent bake -> validation gate -> promote (keeps backups).
        # Run from the win-validator checkout (cwd), or set an absolute path to golden_build.py.
        # Point MYATG_SRC at a myatg checkout (defaults to ../myatg beside this repo).
        # NOTHING parses this file: the base is passed to the builder explicitly (or set
        # GOLDEN_BUILD_BASE in winval.env) — keep it equal to image.base_qcow2 above.
        - "sudo /opt/win-validator/.venv/bin/python golden_build.py build-and-promote /var/lib/libvirt/images/winserver2025-core.qcow2"

    # domain shape
    mem_mb: 4096
    vcpus: 2
    network: default
    disk_bus: sata
    nic_model: e1000
    overlay_dir: /dev/shm
    agent_port: 8765

    # pool / reuse policy (jobs_per_recycle overridable at runtime via AUTHENTICODE_JOBS_PER_RECYCLE)
    warm_size: 2
    jobs_per_recycle: 25
    max_jobs_per_slot: 0

    # egress (rooter model) — documentation of the AUTHENTICODE_EXIT / EGRESS_PORTS / BLOCK_INTERNAL knobs above;
    # this block is not read. exit: direct | openvpn | wireguard | tor | inetsim.
    # egress_ports composes onto any exit; unset = all traffic over the exit. tor blocks non-TCP.
    egress:
      exit: direct
      # egress_ports: [53, 80, 443, 8080]
      # block_internal: true
      # vpn_table: vpn
      # vpn_tun: tun0
